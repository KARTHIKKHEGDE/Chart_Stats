services:
  - type: web
    name: gapup-fade-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 chart_stats:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: POLYGON_API_KEY
        sync: false
      - key: POLYGON_API_KEYS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_FEED
        value: sip
