services:
  - type: web
    name: gapup-fade-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 chart_stats:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: POLYGON_API_KEY
        sync: false
      - key: POLYGON_API_KEYS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_VERIFY_MODEL
        value: gemini-3.5-flash
