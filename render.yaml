services:
  - type: web
    name: gapup-fade-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    # One process keeps per-key pacing shared; 50 threads can serve a 50-key burst.
    startCommand: gunicorn --workers 1 --threads 50 --timeout 120 chart_stats:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOCAL_MAX
        value: "1"
      - key: MAX_EVENTS
        value: "50"
      - key: OPTIONAL_WAIT
        value: "1.25"
      - key: FETCH_WORKERS_CAP
        value: "100"
      - key: ANALYZE_WORKERS
        value: "32"
      - key: REPORT_WORKERS
        value: "8"
      - key: SPIKE_WORKERS
        value: "50"
      - key: WARMUP_WORKERS
        value: "8"
      - key: SERVER_THREADS
        value: "50"
      - key: YAHOO_REQUEST_LIMIT
        value: "16"
      - key: POLYGON_API_KEY
        sync: false
      - key: POLYGON_API_KEYS
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: POLYGON_RPM
        value: "5"          # 50 unique keys x 5 requests/minute = 250 requests/minute
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_FEED
        value: sip
