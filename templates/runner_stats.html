<!doctype html><html><head><meta charset="utf-8"><title>Runner Stats – Multiday Rally & FRD</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--g:#26d974;--r:#ff4d4d;--y:#ffd23f;--b:#6cc4ff;--c:#29a8ff;--w:#e8e8e8;--d:#8a8a8a;--line:#262626}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--w);font:15px/1.45 Consolas,"SF Mono",Menlo,monospace}
.bar{display:flex;gap:10px;padding:18px 34px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.csvManager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 34px;border-bottom:1px solid var(--line);background:#080a0d}.csvManager strong{color:var(--c);margin-right:6px}.csvManager select{min-width:190px}.csvManager input{width:180px}.csvManager .csvHint{color:var(--d);font-size:11px;flex-basis:100%;margin-left:0}.csvManager .csvState{color:var(--g);font-size:11px;min-width:120px}
input[type=text],input[type=number]{background:#0d0d0d;border:1px solid var(--line);color:#fff;font:inherit;font-size:17px;padding:0 12px;height:46px}
input[type=date]{background:#0d0d0d;border:1px solid var(--line);color:#fff;font:inherit;font-size:14px;padding:0 10px;height:46px;color-scheme:dark}
#t{width:130px;text-transform:uppercase;font-size:19px;font-weight:bold}
button{background:#0d0d0d;border:1px solid var(--line);color:#fff;font:inherit;font-size:15px;padding:0 16px;height:46px;cursor:pointer;transition:all .15s}
button:hover{background:#1a1a1a}
label{color:var(--d);font-size:13px;display:flex;flex-direction:column;gap:3px}
#out{margin:0 34px 40px;border:1px solid #1a1a1a;padding:20px 22px;background:#000}
.hdr{font-size:18px;font-weight:bold;color:var(--w);margin:0 0 4px}
.alt{color:var(--d);font-size:13px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.card{border:1px solid var(--line);padding:10px 14px;background:#0a0a0c}
.card .k{color:var(--d);font-size:12px;margin-bottom:3px}
.card .v{font-size:20px;font-weight:bold;color:var(--w);margin-bottom:2px}
.card .s{color:var(--d);font-size:12px;word-break:break-word}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;margin-top:10px}
.sec{border:1px solid var(--line);padding:10px 14px;background:#0a0a0c}
.sec h3{margin:0 0 8px;font-size:13px;color:var(--c);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;justify-content:space-between;gap:16px;padding:3px 0;border-bottom:1px solid #151518}
.row:last-child{border:0}.row span:first-child{color:var(--d)}.row span:last-child{color:var(--w);text-align:right}
.scroll{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:normal;color:var(--w);padding:3px 14px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:3px 14px 3px 0;white-space:nowrap;color:var(--d)}
td:first-child{color:var(--w)}tr:hover td{background:#0a0a0c}
.note{color:#a08840;font-size:12px;margin-top:4px}.err{color:var(--r)}.status{color:var(--d);font-size:13px;margin-left:4px}
h2{font-size:12px;letter-spacing:.1em;color:var(--c);text-transform:uppercase;margin:22px 0 0;border-bottom:1px solid var(--line);padding-bottom:4px}
.back-btn{margin-left:auto;border-color:var(--c);color:var(--c);font-size:13px;height:40px;padding:0 16px}.back-btn:hover{background:#001a33}
#c15wrap{overflow-x:auto;border:1px solid var(--line);background:#070709;position:relative;margin-top:8px;user-select:none;scrollbar-color:#333 #070709}
.btn-tool{font-size:12px;padding:2px 10px;height:28px;line-height:1;border-radius:2px;display:inline-flex;align-items:center;gap:4px}
.copyHeading{display:flex;align-items:center;gap:12px}.copyHeading h2,.copyHeading h3{flex:1}.copyHeading .btn-tool{flex:none}
.btn-tool:hover{filter:brightness(1.2)}
.leg-pill{border:1px solid #444;padding:4px 10px;font-size:12px;background:#0a0a0c;display:inline-flex;align-items:center;gap:8px;border-radius:2px}

/* Enlarge / Fullscreen mode */
#c15section.enlarged{
  position:fixed;inset:0;z-index:99999;background:#050507;padding:16px 24px;display:flex;flex-direction:column;overflow:hidden;
}
#c15section.enlarged #c15wrap{
  flex:1;height:calc(100vh - 120px)!important;max-height:calc(100vh - 120px)!important;margin-top:8px;
}
.ticker_tab:hover{background:#00221c!important}
</style></head><body>
<div class="bar">
  <input id="t" type="text" placeholder="TICKER" autofocus autocomplete="off" spellcheck="false">
  <label>Rally start date<input id="s" type="date"></label>
  <label>FRD (optional)<input id="f" type="date"></label>
  <label>Float M (optional)<input id="fl" type="number" step="any" style="width:110px"></label>
  <button id="go">Get stats</button>
  <button id="rf">Refresh</button>


  <span id="st" class="status"></span>
  <button class="back-btn" id="backbtn">← Back to Chart Stats</button>
</div>
<div class="csvManager" id="csvManager">
  <strong>My setup CSVs</strong>
  <select id="csvSelect" title="Choose the CSV to append to"><option value="">Select a CSV</option></select>
  <input id="csvNewName" type="text" maxlength="80" placeholder="Name a new CSV">
  <button id="csvCreate">Create CSV</button>
  <button id="csvAppend" disabled>Append current setup</button>
  <button id="csvDownload" disabled>Download CSV</button>
  <button id="csvDelete" disabled style="color:var(--r);border-color:var(--r)">Delete CSV</button>
  <span id="csvState" class="csvState">Loading your saved CSVs…</span>
  <span class="csvHint">Share and dollar amounts are in millions. All numeric values are rounded to two decimals. Premarket volume / float is included as a multiple. Your CSV autosaves privately to your account.</span>
</div>
<!-- Multi-Ticker Tab Bar -->
<div id="tab_bar" style="display:none;padding:8px 34px 0;background:#050505;border-bottom:1px solid var(--line);gap:6px;overflow-x:auto;align-items:center;flex-wrap:nowrap"></div>
<div id="out"><span class="d">Enter a ticker and rally start date, then press Get stats.</span></div>
<script src="/static/stock_chart.js"></script>
<script>
let LAST=null, API_BASE='/api';
const $=id=>document.getElementById(id);

let openTabs = {}; // t -> { ticker, start, frd, float_m, data, status, error, isRunning }
let activeTab = null;
let _chartState = null, runnerChartRequestId = 0;

if(location.pathname.startsWith('/runner')) API_BASE='/api/runner';
document.getElementById('backbtn').onclick=()=>{
  if(window.opener && !window.opener.closed){
    window.close();
  } else if(document.referrer && document.referrer !== window.location.href){
    window.location.href = document.referrer;
  } else {
    window.location.href = '/';
  }
};

function renderTabBar(){
  const bar = $('tab_bar');
  const tickers = Object.keys(openTabs);
  if(!tickers.length){
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';

  bar.innerHTML = tickers.map(t => {
    const isActive = t === activeTab;
    const tabObj = openTabs[t];
    const isRunning = tabObj && tabObj.isRunning;
    const bg = isActive ? '#002b24' : '#080808';
    const borderTop = isActive ? '2px solid #00c9a7' : '2px solid transparent';
    const color = isActive ? '#00c9a7' : '#888';
    const border = isActive ? '1px solid #005a48' : '1px solid #1f1f1f';

    return `<div class="ticker_tab" onclick="switchTab('${esc(t)}')" style="background:${bg};border:${border};border-top:${borderTop};color:${color};padding:8px 14px;border-radius:4px 4px 0 0;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;transition:background 0.15s">`+
      `<span style="font-weight:bold">${esc(t)}</span>`+
      (isRunning ? '<span style="color:#ffd23f;font-size:11px" title="Analyzing...">●</span>' : '')+
      `<span onclick="event.stopPropagation(); closeTab('${esc(t)}')" style="font-size:14px;color:#666;line-height:1;padding:0 2px" onmouseover="this.style.color='#ff5a5a'" onmouseout="this.style.color='#666'">✕</span>`+
    `</div>`;
  }).join('');
}

function switchTab(t){
  if(!openTabs[t]) return;
  activeTab = t;
  const tab = openTabs[t];
  $('t').value = tab.ticker;
  $('s').value = tab.start || '';
  $('f').value = tab.frd || '';
  $('fl').value = tab.float_m || '';
  $('st').textContent = tab.status || '';
  renderTabBar();

  if(tab.isRunning){
    $('out').innerHTML = `<span class="d">Loading runner stats for <b>${esc(t)}</b>…</span>`;
  } else if(tab.error){
    $('out').innerHTML = '<span class="err">' + esc(tab.error) + '</span>';
  } else if(tab.data){
    LAST = tab.data;
    render(tab.data);
  }
  renderCsvWorkspace();
}

function closeTab(t){
  if(!openTabs[t]) return;
  delete openTabs[t];

  if(activeTab === t){
    const remaining = Object.keys(openTabs);
    activeTab = remaining.length ? remaining[remaining.length - 1] : null;
    if(activeTab){
      switchTab(activeTab);
    } else {
      $('t').value = '';
      $('s').value = '';
      $('f').value = '';
      $('fl').value = '';
      $('st').textContent = '';
      $('out').innerHTML = '<span class="d">Enter a ticker and rally start date, then press Get stats.</span>';
      LAST = null;
      _chartState = null;
      renderTabBar();
    }
  } else {
    renderTabBar();
  }
}

async function run(refresh){
  let t = $('t').value.trim().toUpperCase();
  if(!t && activeTab) t = activeTab;
  if(!t) return;
  if(!$('s').value){
    $('out').innerHTML = '<span class="err">Enter the rally start date.</span>';
    return;
  }

  if(!openTabs[t]){
    openTabs[t] = {
      ticker: t,
      start: $('s').value,
      frd: $('f').value,
      float_m: $('fl').value,
      data: null,
      status: 'loading…',
      error: null,
      isRunning: true
    };
  }

  const tab = openTabs[t];
  tab.start = $('s').value;
  tab.frd = $('f').value;
  tab.float_m = $('fl').value;
  tab.isRunning = true;
  tab.status = 'loading…';
  activeTab = t;
  renderTabBar();

  $('st').textContent = 'loading…';
  renderCsvWorkspace();
  if(!tab.data || refresh){
    $('out').innerHTML = `<span class="d">Loading runner stats for <b>${esc(t)}</b>…</span>`;
  }

  const q = new URLSearchParams({
    ticker: t,
    start: tab.start,
    frd: tab.frd || '',
    float_m: tab.float_m || ''
  });

  try {
    const r = await fetch(API_BASE + '/analyze?' + q);
    const j = await r.json();
    tab.isRunning = false;
    if(!r.ok){
      tab.error = j.error || 'error';
      tab.status = 'Failed';
      if(activeTab === t){
        $('out').innerHTML = '<span class="err">' + esc(tab.error) + '</span>';
        $('st').textContent = '';
      }
    } else {
      tab.data = j;
      tab.error = null;
      tab.status = '';
      if(activeTab === t){
        LAST = j;
        render(j);
        renderCsvWorkspace();
        $('st').textContent = '';
      }
    }
  } catch(e) {
    tab.isRunning = false;
    tab.error = String(e);
    tab.status = 'Error';
    if(activeTab === t){
      $('out').innerHTML = '<span class="err">' + esc(e) + '</span>';
      $('st').textContent = '';
    }
  }
  renderTabBar();
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function formatDateMDY(value){const raw=String(value??'');const m=raw.slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[2]}/${m[3]}/${m[1]}`:raw}

function render(j){
  _chartState=null;runnerChartRequestId++;
  let h='<section class="copySection" id="keyStatsCopy"><div class="hdr">'+esc(j.header)+'</div>';
  if(j.alts&&j.alts.length)h+='<div class="alt">other rallies: '+j.alts.map(esc).join(' · ')+'</div>';
  h+='<div class="copyHeading"><h2>Key stats</h2><button class="btn-tool" data-copy-section="keyStatsCopy" data-copy-label="Key Stats">Copy image</button></div><div class="grid">'+j.p1.map(c=>'<div class="card"><div class="k">'+esc(c[0])+'</div><div class="v">'+esc(c[1])+'</div><div class="s">'+esc(c[2]||'')+'</div></div>').join('')+'</div></section>';
  
  if(j.chart_15&&j.chart_15.bars&&j.chart_15.bars.length){
    h+='<section id="c15section" style="margin-top:24px;border:1px solid #262626;background:#07090c;padding:12px">'
      +'<header style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">'
      +'<h2 style="margin:0;border:0;padding:0">Rally chart</h2>'
      +'<span style="color:var(--d);font-size:12px">1-minute OHLCV · Postmarket to 20:00 ET · X-axis IST</span>'
      +'<label style="margin-left:auto;flex-direction:row;align-items:center;gap:5px;color:#ddd">Interval <select id="runner_chart_tf" style="height:30px"><option>1m</option><option selected>2m</option><option>3m</option><option>5m</option><option>15m</option><option>30m</option><option value="1d">Day</option></select></label>'
      +'<label style="flex-direction:row;align-items:center;gap:5px;color:#ddd">Sessions <select id="runner_chart_days" style="height:30px"><option value="1">1</option><option value="3">3</option><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="60" selected>60</option></select></label>'
      +'<label style="flex-direction:row;align-items:center;gap:5px;color:#d7ff6e"><input type="checkbox" id="runner_chart_bz" checked style="width:14px;height:14px"> Bone Zone (9/21 EMA)</label>'
      +'<label style="flex-direction:row;align-items:center;gap:5px;color:#fff"><input type="checkbox" id="runner_chart_vwap" checked style="width:14px;height:14px"> VWAP</label>'
      +'<label style="flex-direction:row;align-items:center;gap:5px;color:#c084fc"><input type="checkbox" id="runner_chart_twap" checked style="width:14px;height:14px"> TWAP</label>'
      +'<button id="runner_chart_avwap" class="btn-tool">AVWAP · Select A → B</button><button id="runner_chart_clear_avwap" class="btn-tool">Clear AVWAP</button>'
      +'<button id="runner_chart_measure" class="btn-tool">Measure range</button><button id="runner_chart_pan" class="btn-tool">Pan</button>'
      +'<button id="runner_chart_delete_measure" class="btn-tool">Delete range</button><button id="runner_chart_clear_measures" class="btn-tool">Clear ranges</button>'
      +'<button id="runner_chart_zoom_out" class="btn-tool" title="Zoom out">−</button><button id="runner_chart_zoom_in" class="btn-tool" title="Zoom in">+</button><button id="runner_chart_zoom_reset" class="btn-tool">Reset</button><button id="runner_chart_copy" class="btn-tool">Copy PNG</button></header>'
      +'<div style="display:flex;gap:14px;flex-wrap:wrap;color:#aab4bf;font-size:11px;padding:4px 2px 8px"><span style="color:#fff">━ VWAP</span><span style="color:#c084fc">━ TWAP</span><span style="color:#ffe45c">AVWAP · set A/B</span><span style="color:#ffd23f">N News</span><span style="color:#62c8ff">S SEC filing</span></div>'
      +'<div id="runner_chart_wrap" style="position:relative;height:540px;min-height:300px;background:#050607;border:1px solid #242b33;overflow:hidden">'
      +'<canvas id="runner_chart_canvas" style="display:block;width:100%;height:100%"></canvas><canvas id="runner_chart_overlay" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>'
      +'<div id="runner_chart_crosshair_v" hidden style="position:absolute;z-index:4;top:0;width:0;border-left:1px dashed rgba(220,232,244,.75);pointer-events:none"></div><div id="runner_chart_crosshair_h" hidden style="position:absolute;z-index:4;left:0;height:0;border-top:1px dashed rgba(220,232,244,.75);pointer-events:none"></div>'
      +'<div id="runner_chart_measure_box" hidden style="position:absolute;z-index:5;max-width:300px;padding:8px 10px;background:rgba(6,13,21,.96);border:1px solid #62c8ff;border-radius:4px;color:#edf6ff;font:13px/1.55 Consolas,monospace;white-space:pre-wrap;pointer-events:none"></div></div>'
      +'<div style="height:76px;margin-top:5px;border:1px solid #242b33;background:#090c10;display:flex;flex-direction:column"><div id="runner_chart_hover_time" style="height:18px;flex:0 0 18px;padding:1px 8px;color:#9ba6b0;font:11px/16px Consolas,monospace">Hover a candle to see its time · IST</div><canvas id="runner_chart_navigator" style="display:block;width:100%;height:calc(100% - 18px);flex:1;min-height:0;touch-action:none;cursor:grab"></canvas></div>'
      +'<div id="runner_chart_quote_line" style="padding:6px 2px;color:#e8edf3;font-size:12px">Hover a candle · change, volume, dollar volume, float</div><div id="runner_chart_status" style="color:#aab4bf;font-size:12px;min-height:18px"></div>'
      +'</section>';
  }
  
  h+='<section class="copySection" id="deepStatsCopy"><div class="copyHeading"><h2>Deep stats</h2><button class="btn-tool" data-copy-section="deepStatsCopy" data-copy-label="Deep Stats">Copy image</button></div><div class="g2">'+j.p2.map(s=>'<div class="sec"><h3>'+esc(s[0])+'</h3>'+s[1].map(r=>'<div class="row"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>').join('')+'</div>').join('')+'</div></section>';
  h+='<section class="copySection" id="rallyDaysCopy"><div class="copyHeading"><h2>Rally days (start → FRD)</h2><button class="btn-tool" data-copy-section="rallyDaysCopy" data-copy-label="Rally Days">Copy image</button></div><div class="scroll"><table><thead><tr>'+j.table.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  j.table.rows.forEach(r=>{
    const tag=(r[r.length-1]||'').trim();
    let rc='';
    if(tag.includes('LOW'))rc='style="color:var(--g)"';
    else if(tag.includes('HIGH'))rc='style="color:var(--y)"';
    else if(tag.includes('FRD'))rc='style="color:var(--r)"';
    h+='<tr '+rc+'>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>';
  });
  h+='</tbody></table>'+j.notes.map(n=>'<div class="note">* '+esc(n)+'</div>').join('')+'</div></section>';
  $('out').innerHTML=h;
  
  if(j.chart_15&&j.chart_15.bars&&j.chart_15.bars.length)setTimeout(()=>initChart15(j.chart_15),20);
}

$('go').onclick=()=>run(false);
$('rf').onclick=()=>run(true);
async function copySectionImage(sectionId,label){
  const source=document.getElementById(sectionId);
  if(!LAST||!source){$('st').textContent='Load a report first.';return;}
  const bounds=source.getBoundingClientRect();
  const width=Math.ceil(Math.max(bounds.width,source.scrollWidth)),height=Math.ceil(Math.max(bounds.height,source.scrollHeight));
  const scale=Math.max(1,Math.min(3,16000/Math.max(width,height)));
  const output=document.createElement('canvas');output.width=Math.ceil(width*scale);output.height=Math.ceil(height*scale);
  const ctx=output.getContext('2d');if(!ctx){$('st').textContent='Could not create the section image.';return;}
  ctx.scale(scale,scale);ctx.fillStyle='#000';ctx.fillRect(0,0,width,height);
  const isTransparent=color=>!color||color==='transparent'||color==='rgba(0, 0, 0, 0)';
  const skip=new Set(['BUTTON','INPUT','SELECT','OPTION']);
  const drawText=node=>{
    const value=node.nodeValue||'';if(!value.trim())return;
    const style=getComputedStyle(node.parentElement),fontSize=parseFloat(style.fontSize)||12;
    ctx.font=style.font||`${style.fontWeight} ${fontSize}px ${style.fontFamily}`;ctx.fillStyle=style.color||'#e8e8e8';ctx.textBaseline='alphabetic';
    const range=document.createRange(),lines=[];let line=null;
    for(let i=0;i<value.length;i++){
      range.setStart(node,i);range.setEnd(node,i+1);const rect=range.getBoundingClientRect();
      if(!rect.width&&!rect.height){if(line){lines.push(line);line=null}continue}
      const top=Math.round(rect.top-bounds.top),left=rect.left-bounds.left;
      if(!line||Math.abs(line.top-top)>1){if(line)lines.push(line);line={top,left,text:value[i],right:rect.right-bounds.left}}
      else{line.text+=value[i];line.right=rect.right-bounds.left}
    }
    if(line)lines.push(line);
    for(const item of lines){let x=item.left;if(style.textAlign==='right')x=item.right;else if(style.textAlign==='center')x=(item.left+item.right)/2;ctx.textAlign=style.textAlign==='start'?'left':style.textAlign;ctx.fillText(item.text,x,item.top+fontSize*.84)}
  };
  const walk=node=>{
    if(node.nodeType===Node.TEXT_NODE){drawText(node);return}
    if(node.nodeType!==Node.ELEMENT_NODE||skip.has(node.tagName))return;
    const rect=node.getBoundingClientRect(),x=rect.left-bounds.left,y=rect.top-bounds.top,style=getComputedStyle(node);
    if(!isTransparent(style.backgroundColor)){ctx.fillStyle=style.backgroundColor;ctx.fillRect(x,y,rect.width,rect.height)}
    const borders=[['borderTopWidth','borderTopColor',x,y,rect.width],['borderBottomWidth','borderBottomColor',x,y+rect.height,rect.width]];
    for(const [w,c,bx,by,bw] of borders){const size=parseFloat(style[w])||0;if(size&&!isTransparent(style[c])){ctx.fillStyle=style[c];ctx.fillRect(bx,by,bw,size)}}
    for(const child of node.childNodes)walk(child);
  };
  walk(source);
  try{
    if(!navigator.clipboard?.write||!window.ClipboardItem)throw new Error('image clipboard is unavailable in this browser');
    const png=new Promise(resolve=>output.toBlob(resolve,'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);$('st').textContent=`Copied ${label} · ${output.width} × ${output.height}px`;setTimeout(()=>$('st').textContent='',3000);
  }catch(error){$('st').textContent=`Could not copy ${label}: ${error.message||'check clipboard permissions'}`}
}
document.addEventListener('click',e=>{const button=e.target.closest('[data-copy-section]');if(button)copySectionImage(button.dataset.copySection,button.dataset.copyLabel||button.dataset.copySection)});

function csvRound(value,digits=2){const n=Number(value);return Number.isFinite(n)?Number(n.toFixed(digits)):value}
function migrateCsvCollection(file){
  let changed=false;
  const renames={
    'Float Before Rally (Shares)':['Float Before Rally (Millions of Shares)',1e-6],
    'Market Capitalization Before Rally (USD)':['Market Capitalization Before Rally (USD Millions)',1e-6],
    'Market Capitalization at Rally High (USD)':['Market Capitalization at Rally High (USD Millions)',1e-6],
    'Dollar Volume from Rally Start to High (USD)':['Dollar Volume from Rally Start to High (USD Millions)',1e-6],
    'First Red Day Premarket Volume (Shares)':['First Red Day Premarket Volume (Millions of Shares)',1e-6],
    'First Red Day Premarket Dollar Volume (USD)':['First Red Day Premarket Dollar Volume (USD Millions)',1e-6],
    'First Red Day Regular-Market Volume (Shares)':['First Red Day Regular-Market Volume (Millions of Shares)',1e-6],
    'First Red Day Regular-Market Dollar Volume (USD)':['First Red Day Regular-Market Dollar Volume (USD Millions)',1e-6],
    'First Red Day Open-to-High Volume (Shares)':['First Red Day Open-to-High Volume (Millions of Shares)',1e-6]
  };
  file.rows=(file.rows||[]).map(original=>{
    const row={...original};
    Object.entries(renames).forEach(([old,[next,scale]])=>{
      if(!(old in row))return;
      if(!(next in row)){const raw=Number(row[old]);row[next]=Number.isFinite(raw)?csvRound(raw*scale):row[old]}
      delete row[old];changed=true;
    });
    ['Float Rotation (Start to Rally High, Times)','Rally-High Market Cap / Pre-Rally Market Cap (Times)','First Red Day Gap Up (%)'].forEach(key=>{
      if(key in row&&row[key]!==''&&row[key]!=null){const value=csvRound(row[key]);if(value!==row[key]){row[key]=value;changed=true}}
    });
    Object.keys(row).filter(key=>/^Leg \d+ Dollar Move per Share$/.test(key)).forEach(key=>{const value=csvRound(row[key]);if(value!==row[key]){row[key]=value;changed=true}});
    ['First Red Day Open Price (USD)','First Red Day High Price (USD)','First Red Day Low Price (USD)','First Red Day Close Price (USD)'].forEach(key=>{
      if(key in row&&row[key]!==''&&row[key]!=null){const value=csvRound(row[key]);if(value!==row[key]){row[key]=value;changed=true}}
    });
    if(row['First Red Day Premarket Volume (Millions of Shares)']!=null&&row['Float Before Rally (Millions of Shares)']!=null&&!('First Red Day Premarket Volume / Float (Times)' in row)){
      const pm=Number(row['First Red Day Premarket Volume (Millions of Shares)']),flt=Number(row['Float Before Rally (Millions of Shares)']);
      row['First Red Day Premarket Volume / Float (Times)']=Number.isFinite(pm)&&Number.isFinite(flt)&&flt>0?csvRound(pm/flt):'';changed=true;
    }
    return row;
  });
  if(changed)file.columns=[...new Set(file.rows.flatMap(row=>Object.keys(row)))];
  return changed;
}
function migrateCsvCollections(){let changed=false;csvCollections.forEach(file=>{if(migrateCsvCollection(file))changed=true});return changed}
function currentCsvSetup(){const tab=activeTab&&openTabs[activeTab];if(tab)return tab.isRunning?null:tab.data||null;return LAST||null}
function renderCsvWorkspace(){
  const select=$('csvSelect');if(!select)return;
  select.replaceChildren(new Option('Select a CSV',''));
  csvCollections.forEach(c=>select.add(new Option(c.name+' ('+(c.rows?.length||0)+')',c.id)));
  if(!csvCollections.some(c=>c.id===selectedCsvId))selectedCsvId=csvCollections[0]?.id||'';
  select.value=selectedCsvId;const hasSelection=!!csvCollections.find(c=>c.id===selectedCsvId);
  $('csvDownload').disabled=!hasSelection;$('csvDelete').disabled=!hasSelection;$('csvAppend').disabled=!hasSelection||!currentCsvSetup();writeLocalCsvWorkspace();
}
async function loadCsvWorkspace(){
  const local=readLocalCsvWorkspace();csvCollections=Array.isArray(local.collections)?local.collections:[];selectedCsvId=local.selected||'';migrateCsvCollections();renderCsvWorkspace();
  try{
    const q=new URLSearchParams({user:CSV_USER,token:CSV_TOKEN}),response=await fetch(CSV_API+'?'+q),data=await response.json();
    if(!response.ok)throw new Error(data.error||'Account CSVs unavailable');csvAccountStorage=data.storage==='account';
    const remote=Array.isArray(data.collections)?data.collections:[];
    if(!remote.length&&csvCollections.length&&csvAccountStorage){csvState('Migrating saved browser CSVs…');await saveCsvWorkspace();return}
    // Keep this browser's saved collections when the server has no account
    // storage configured; an empty server response must not erase local data.
    if(csvAccountStorage||!csvCollections.length)csvCollections=remote;
    const migrated=migrateCsvCollections();
    selectedCsvId=local.selected||csvCollections[0]?.id||'';renderCsvWorkspace();
    csvState(csvAccountStorage?'Account autosave ready':'Browser-only autosave');
    if(migrated)await saveCsvWorkspace();
  }catch(error){csvAccountStorage=false;csvCollections=Array.isArray(local.collections)?local.collections:[];selectedCsvId=local.selected||'';renderCsvWorkspace();csvState(csvCollections.length?'Browser-only autosave · account sync unavailable':'Account sync unavailable; CSVs will save in this browser',true)}
}
function saveCsvWorkspace(){
  csvCollections.forEach(c=>{c.updated_at=new Date().toISOString()});writeLocalCsvWorkspace();
  const snapshot=JSON.stringify({user:CSV_USER,token:CSV_TOKEN,collections:csvCollections});
  csvSaveQueue=csvSaveQueue.catch(()=>{}).then(async()=>{
    try{const response=await fetch(CSV_API,{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot}),data=await response.json();if(!response.ok)throw new Error(data.error||'Account save failed');csvAccountStorage=data.storage==='account';csvState(csvAccountStorage?'Autosaved to your account':'Autosaved in this browser')}
    catch(error){csvAccountStorage=false;csvState('Saved in this browser only · '+(error.message||'account sync unavailable'),true)}
  });
  return csvSaveQueue;
}

    'First Red Day Open-to-High Volume (Millions of Shares)':s.frd_open_to_high_volume==null?'':csvRound(s.frd_open_to_high_volume/1e6),
    'First Red Day Open Price (USD)':s.frd_open==null?'':csvRound(s.frd_open),

  });
  return row;

function csvCell(value){const text=String(value??'');return /[",\r\n]/.test(text)?'"'+text.replace(/"/g,'""')+'"':text}
function csvRowKey(row){
  const ticker=String(row?.Ticker||'').trim().toUpperCase();
  const start=String(row?.['Rally Start Date']||row?.['Rally start input']||'').trim();
  return ticker&&start?ticker+'|'+start:'';
}
function downloadSelectedCsv(){
  const file=selectedCsv();if(!file)return;
  const columns=[...(file.columns||[])];(file.rows||[]).forEach(row=>Object.keys(row).forEach(key=>{if(!columns.includes(key))columns.push(key)}));
  const text=[columns.map(csvCell).join(','),...(file.rows||[]).map(row=>columns.map(col=>csvCell(row[col])).join(','))].join('\r\n');
  const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');
  a.href=url;a.download=file.name.replace(/[\\/:*?"<>|]/g,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('csvSelect').onchange=()=>{selectedCsvId=$('csvSelect').value;renderCsvWorkspace()};

  const id=(crypto.randomUUID?crypto.randomUUID():'csv-'+Date.now()+'-'+Math.random().toString(36).slice(2));

};
$('csvAppend').onclick=async()=>{

  const key=csvRowKey(row),existingIndex=key?file.rows.findIndex(existing=>csvRowKey(existing)===key):-1;
  if(existingIndex>=0)file.rows[existingIndex]=row;else file.rows.push(row);
  file.columns=[...new Set(file.rows.flatMap(existing=>Object.keys(existing)))];renderCsvWorkspace();await saveCsvWorkspace();

async function loadRunnerChartEvents(data){
  const dates=[...new Set((data.bars||[]).map(bar=>bar.date).filter(Boolean))].sort(),all=[];
  for(let i=0;i<dates.length;i+=100){
    const query=new URLSearchParams({ticker:data.ticker||'',dates:dates.slice(i,i+100).join(','),include_previous:'1',user:CSV_USER||localStorage.getItem('gap_user')||'',token:CSV_TOKEN||localStorage.getItem('gap_token')||''});
    try{const response=await fetch('/api/chart-events?'+query),payload=await response.json();if(!response.ok)throw new Error(payload.error||`Chart events failed (HTTP ${response.status})`);all.push(...(payload.events||[]));}
    catch(error){console.error('Could not load Runner Stats chart events:',error);}
  }
  return all;
}
function runnerIstOffset(day){
  try{
    const name=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',timeZoneName:'shortOffset'}).formatToParts(new Date(day+'T12:00:00Z')).find(part=>part.type==='timeZoneName')?.value||'';
    const match=name.match(/GMT([+-])(\d{1,2})(?::?(\d{2}))?/);
    if(match){const et=(match[1]==='-'?-1:1)*(Number(match[2])*60+Number(match[3]||0));return 330-et;}
  }catch{}
  return 630;
}
function renderRunnerStockChart(){
  const state=_chartState;if(!state?.chart)return;
  const cv=$('runner_chart_canvas'),ui=window.chartFeatureUi('runner_chart');
  cv._chart=state.chart;cv._event={ticker:state.ticker,date:state.anchorDate};cv._timeframe=state.timeframe;
  cv._anchorDate=state.anchorDate;cv._activeDate=state.anchorDate;cv._chartDays=state.days;cv._hoverTimeReadout=$('runner_chart_hover_time');
  cv._marketEvents=state.events||[];cv._floatShares=state.floatShares;
  cv._panOffset=state.panOffset||0;cv._rangeZoom=state.zoom||1;cv._zoom=cv._rangeZoom;cv._yZoom=state.yZoom||1;
  cv._rangeMeasures=state.rangeMeasures||(state.rangeMeasures=[]);cv._selectedRangeId=state.selectedRangeId||null;
  cv._avwapAnchors=state.avwapAnchors||null;cv._showVWAP=$('runner_chart_vwap').checked;cv._showTWAP=$('runner_chart_twap').checked;
  cv._showHODAVWAP=false;cv._showCrosshair=true;cv._showOhlcTip=true;cv._renderDpr=2;
  if(!cv._featureControlsBound){
    cv._rangeMeasureMode=false;cv._zoomSelectMode=true;cv._panToolMode=false;cv._avwapSelectMode=false;
    window.setGapDeepDiveMouseMode('zoom',cv,ui);
  }
  cv._onPanChange=value=>{state.panOffset=value;};
  cv._onPanEdge=side=>{
    if(state.loading||state.days>=60)return;
    const dates=state.dates||[],edge=dates[side>0?dates.length-1:0];if(!edge)return;
    state.anchorDate=edge;state.days=[1,3,5,10,20,60].find(days=>days>state.days)||60;
    $('runner_chart_days').value=String(state.days);state.panOffset=0;state.zoom=1;
    loadRunnerStockChartContext(state);
  };
  window.bindUnifiedChartFeatures(cv,ui,()=>{
    state.panOffset=cv._panOffset||0;state.yZoom=cv._yZoom||1;state.zoom=cv._rangeZoom||1;
    state.avwapAnchors=cv._avwapAnchors;state.rangeMeasures=cv._rangeMeasures||[];
    state.selectedRangeId=cv._selectedRangeId;
  },renderRunnerStockChart);
  window.drawSharedStockChart(cv,state.chart,'none',$('runner_chart_bz').checked,540,state.timeframe,state.zoom||1);
}
async function loadRunnerStockChartContext(state){
  const requestId=++runnerChartRequestId;state.loading=true;
  $('runner_chart_status').textContent=`Loading ${state.days}-session chart context for ${state.ticker}…`;
  const query=new URLSearchParams({ticker:state.ticker,date:state.anchorDate,days:String(state.days),tf:state.timeframe,user:CSV_USER,token:CSV_TOKEN,postmarket:'1'});
  try{
    const response=await fetch('/api/chart-context?'+query.toString()),data=await response.json();
    if(!response.ok)throw new Error(data.error||`Could not load chart data (HTTP ${response.status})`);
    if(requestId!==runnerChartRequestId)return;
    state.chart={ticker:state.ticker,date:state.anchorDate,bars:data.bars,after_hours:data.after_hours!==false,off:runnerIstOffset(state.anchorDate),float_shares:state.floatShares,sig:[]};
    state.dates=data.dates||[];state.panOffset=0;state.yZoom=1;
    state.zoom=state.timeframe==='1d'?1:1/Math.max(1,state.dates.length);
    $('runner_chart_status').textContent=`Loaded ${state.dates.length} session${state.dates.length===1?'':'s'} for ${state.ticker}.`;
    renderRunnerStockChart();
    const eventData={ticker:state.ticker,bars:state.dates.map(date=>({date}))};
    loadRunnerChartEvents(eventData).then(events=>{if(requestId!==runnerChartRequestId)return;state.events=events;renderRunnerStockChart();});
  }catch(error){
    if(requestId===runnerChartRequestId)$('runner_chart_status').textContent=`Could not load chart range: ${error.message}`;
  }finally{if(requestId===runnerChartRequestId)state.loading=false;}
}
function initChart15(data){
